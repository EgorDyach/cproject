services:
  postgres:
    image: postgres:16-alpine
    container_name: chakchakshop_postgres
    environment:
      POSTGRES_DB: chakchakshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5455:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chakchakshop_network

  redis:
    image: redis:7-alpine
    container_name: chakchakshop_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chakchakshop_network

  prometheus:
    image: prom/prometheus:latest
    container_name: chakchakshop_prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - chakchakshop_network

  grafana:
    image: grafana/grafana:latest
    container_name: chakchakshop_grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - chakchakshop_network

  api:
    build:
      context: .
      dockerfile: src/ChakChakShop.API/Dockerfile
    container_name: chakchakshop_api
    ports:
      - '8080:8080'
      - '8081:8081'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=chakchakshop;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379,abortConnect=false,connectRetry=5,connectTimeout=5000
      - Jwt__Key=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      - Jwt__Issuer=ChakChakShop
      - Jwt__Audience=ChakChakShop
      - Jwt__ExpirationMinutes=1440
      - ApiKey=your-api-key-here-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chakchakshop_network
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8080/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  chakchakshop_network:
    driver: bridge
